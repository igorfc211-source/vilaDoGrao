
<style>

  .ew-tag {

  .ew-tag::before {

  .ew-title {

  .ew-google-badge {

  .ew-stars-row {

  .ew-star-g {

    height: 14px;

  }

  .ew-track-wrap {
    position: relative;
    z-index: 2;
    overflow: hidden;
    padding: 8px 0;
  }

  .ew-track {
    display: flex;
    gap: 20px;

    padding: 0 40px;

  }

  .ew-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 20px;
    padding: 28px;
    flex: 0 0 320px;
    min-width: 320px;

    cursor: default;
    position: relative;
    overflow: hidden;
  }

  .ew-card::after {
    content: '"';
    position: absolute;
    right: 20px;
    top: 16px;
    font-family: 'Playfair Display', serif;
    font-size: 80px;
    color: rgba(250,204,21,0.06);
    line-height: 1;
    pointer-events: none;
  }

  .ew-card:hover {

  .ew-card-top {

  .ew-avatar {

    border-radius: 50%;

    justify-content: center;

  .ew-av-c { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
  .ew-av-d { background: rgba(249,115,22,0.15); color: #fb923c; border: 1px solid rgba(249,115,22,0.2); }

    margin: 0;

  .ew-stars {

  .ew-s {

    fill: #facc15;

  .ew-text {

    line-height: 1.7;
    color: rgba(255,255,255,0.55);

  .ew-badge-local {

    align-items: center;

    border: 1px solid rgba(250,204,21,0.12);

    padding: 3px 10px;
    font-size: 10px;
    color: rgba(250,204,21,0.7);
    font-weight: 500;

  .ew-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 44px;
    position: relative;
    z-index: 2;

  .ew-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    outline: none;
  }

  .ew-btn:hover {
    border-color: rgba(250,204,21,0.4);
    background: rgba(250,204,21,0.08);
    color: #facc15;
    transform: scale(1.05);
  }

  .ew-dots {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .ew-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: all 0.3s;
    cursor: pointer;
  }

  .ew-dot.active {
    width: 24px;
    border-radius: 3px;
    background: #facc15;
  }

  .ew-cta-row {
    text-align: center;
    margin-top: 48px;
    position: relative;
    z-index: 2;
    padding: 0 24px;
  }

  .ew-cta-text {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin: 0 0 16px;
    font-weight: 400;
  }

  .ew-cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid rgba(250,204,21,0.25);
    border-radius: 100px;
    padding: 12px 28px;
    font-size: 13px;
    font-weight: 600;
    color: #facc15;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    font-family: 'DM Sans', sans-serif;
  }

  .ew-cta-btn:hover {
    background: rgba(250,204,21,0.08);
    border-color: rgba(250,204,21,0.5);
    transform: translateY(-2px);
  }

  .ew-edge-l, .ew-edge-r {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 80px;
    pointer-events: none;
    z-index: 3;
  }
  .ew-edge-l { left: 0; background: linear-gradient(to right, #09090B, transparent); }
  .ew-edge-r { right: 0; background: linear-gradient(to left, #09090B, transparent); }
</style>

        <svg class="ew-star-g" viewBox="0 0 20 20"><path d="M10 1l2.39 4.84 5.34.78-3.87 3.77.91 5.32L10 13.27l-4.77 2.44.91-5.32L2.27 6.62l5.34-.78z"/></svg>

<script>
const reviews = [
  {
    name: "Edna Gonçalves",
    initials: "EG",
    color: "ew-av-a",
    date: "8 meses atrás",
    badge: null,
    text: "O espaço é lindo, muito bem cuidado e perfeito tanto para festas quanto para aulas de dança. O Wall é extremamente receptivo e atencioso, sempre deixando todos muito à vontade. É um lugar onde a gente se sente bem e acolhido.",
    stars: 5
  },
  {
    name: "Guilherme Biscolo",
    initials: "GB",
    color: "ew-av-b",
    date: "um ano atrás",
    badge: "Local Guide",
    text: "Que lugar surreal! Difícil até acreditar que existe um lugar desse com esse preço. Comi na beira da piscina, R$ 29,90 à vontade e com sobremesa. Muito bom!",
    stars: 5
  },
  {
    name: "Carol Coutinho",
    initials: "CC",
    color: "ew-av-c",
    date: "9 meses atrás",
    badge: "Local Guide",
    text: "Local de evento com estacionamento local e cardápio amplo de drinks e porções. Música ao vivo que anima ainda mais o ambiente!",
    stars: 5
  },
  {
    name: "Geovane Ferreira",
    initials: "GF",
    color: "ew-av-d",
    date: "9 meses atrás",
    badge: null,
    text: "Lugar ideal para você realizar seus eventos. Espaço bem organizado, equipe atenciosa e ambiente que impressiona quem chega.",
    stars: 5
  },
  {
    name: "Rafael Cidral",
    initials: "RC",
    color: "ew-av-e",
    date: "um ano atrás",
    badge: "Local Guide",
    text: "Lugar muito gostoso, comida boa, bebidas variadas! Recomendo sem dúvida — o proprietário é muito gente boa e deixa todos à vontade.",
    stars: 5
  },
  {
    name: "Jackson e Alessandro",
    initials: "JA",
    color: "ew-av-f",
    date: "um ano atrás",
    badge: null,
    text: "Fiz o meu evento lá e fui super bem atendido. Equipe top, espaço maravilhoso! Não tenho uma palavra sequer de crítica.",
    stars: 5
  },
  {
    name: "Ricardo Spoo",
    initials: "RS",
    color: "ew-av-a",
    date: "um ano atrás",
    badge: "Local Guide",
    text: "Lugar agradável para um lanche de final de dia. Ambiente bem cuidado e com aquele clima especial que faz querer voltar.",
    stars: 5
  },
  {
    name: "Paulo de Tarso",
    initials: "PT",
    color: "ew-av-b",
    date: "há 8 anos",
    badge: null,
    text: "Local amplo, boa comida, cervejas estupidamente geladas e ótimo atendimento. Um dos melhores espaços da região.",
    stars: 5
  },
  {
    name: "Lúcia Elena",
    initials: "LE",
    color: "ew-av-c",
    date: "um ano atrás",
    badge: "Local Guide",
    text: "Ambiente selecionado, muita cortesia e rapidez. Cardápio variado que agrada a todos. Uma experiência muito agradável!",
    stars: 5
  },
  {
    name: "Cris Santana",
    initials: "CS",
    color: "ew-av-d",
    date: "um ano atrás",
    badge: null,
    text: "Esse lugar é maravilhoso, super recomendo! Um espaço que surpreende pela qualidade e pelo carinho com que recebem cada cliente.",
    stars: 5
  },
  {
    name: "Anderson",
    initials: "AN",
    color: "ew-av-e",
    date: "2 anos atrás",
    badge: null,
    text: "Muito bom! Ambiente diferenciado, atendimento de qualidade. Perfeito para quem busca um local especial para comemorar.",
    stars: 5
  },
  {
    name: "Luciano Queiroz",
    initials: "LQ",
    color: "ew-av-f",
    date: "8 meses atrás",
    badge: null,
    text: "Lugar top! Superou todas as minhas expectativas. Estrutura impecável, ambiente incrível e equipe sempre prestativa.",
    stars: 5
  }
];

const starSVG = `<svg class="ew-s" viewBox="0 0 20 20"><path d="M10 1l2.39 4.84 5.34.78-3.87 3.77.91 5.32L10 13.27l-4.77 2.44.91-5.32L2.27 6.62l5.34-.78z"/></svg>`;

const track = document.getElementById('ewTrack');
const dotsEl = document.getElementById('ewDots');

reviews.forEach(r => {
  const card = document.createElement('div');
  card.className = 'ew-card';
  card.innerHTML = `
    <div class="ew-card-top">
      <div class="ew-avatar ${r.color}">${r.initials}</div>
      <div class="ew-meta">
        <p class="ew-name">${r.name}</p>
        <p class="ew-date">${r.date}</p>
      </div>
    </div>
    ${r.badge ? `<div class="ew-badge-local"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z" opacity=".3"/></svg> ${r.badge}</div>` : ''}
    <div class="ew-stars">${starSVG.repeat(r.stars)}</div>
    <p class="ew-text">${r.text}</p>
  `;
  track.appendChild(card);
});

const totalPages = Math.ceil(reviews.length / 3);
for (let i = 0; i < totalPages; i++) {
  const dot = document.createElement('div');
  dot.className = 'ew-dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(dot);
}

let current = 0;
const cardWidth = 320 + 20;
const padding = 40;

function goTo(idx) {
  current = Math.max(0, Math.min(idx, totalPages - 1));
  const offset = current * (cardWidth * 3);
  track.style.transform = `translateX(-${offset}px)`;
  document.querySelectorAll('.ew-dot').forEach((d, i) => {
    d.classList.toggle('active', i === current);
  });
}

document.getElementById('ewPrev').addEventListener('click', () => goTo(current - 1));
document.getElementById('ewNext').addEventListener('click', () => goTo(current + 1));

let startX = 0;
track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
track.addEventListener('touchend', e => {
  const diff = startX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) goTo(diff > 0 ? current + 1 : current - 1);
}, { passive: true });

let auto = setInterval(() => goTo((current + 1) % totalPages), 5000);
document.getElementById('ewRoot').addEventListener('mouseenter', () => clearInterval(auto));
document.getElementById('ewRoot').addEventListener('mouseleave', () => {
  auto = setInterval(() => goTo((current + 1) % totalPages), 5000);
});
</script>
